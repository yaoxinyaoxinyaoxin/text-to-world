  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #0d1117; color: #e6edf3; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.85; }
    .topbar { padding: 1rem 1.5rem; border-bottom: 1px solid #21262d; color: #8b949e; font-size: .92rem; }
    .topbar a, .article a { color: #58a6ff; text-decoration: none; }
    .topbar a:hover, .article a:hover { text-decoration: underline; }
    .article { max-width: 820px; margin: 3rem auto; padding: 0 1.5rem 4rem; font-size: 1.08rem; }
    h1, h2 { line-height: 1.35; color: #f0f6fc; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 1.5rem; }
    h2 { font-size: 1.55rem; margin: 2.7rem 0 1rem; padding-bottom: .45rem; border-bottom: 1px solid #30363d; }
    p { margin: 1.05rem 0; }
    strong { color: #f0f6fc; }

    footer { max-width: 820px; margin: 0 auto; padding: 1.5rem; border-top: 1px solid #21262d; color: #8b949e; text-align: center; font-size: .9rem; }
    @media (max-width: 640px) { .article { margin-top: 2rem; font-size: 1rem; } h2 { font-size: 1.35rem; } }
  </style>

<body>
  <nav class="topbar"><a href="./">text-to-world</a> / 评论</nav>
  <main id="article" class="article"><p class="loading">正在载入文章…</p></main>
  <footer><a href="./">返回 text-to-world</a> · <a href="https://github.com/yaoxinyaoxinyaoxin/text-to-world">GitHub 仓库</a></footer>
  <script>
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function inline(text) {
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function renderMarkdown(markdown) {
      const out = [];
      let paragraph = [];
      const flush = () => {
        if (paragraph.length) out.push('<p>' + inline(paragraph.join(' ')) + '</p>');
        paragraph = [];
      };
      for (const raw of markdown.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || /^---+$/.test(line)) { flush(); continue; }
        const heading = line.match(/^(#{1,2})\s+(.+)$/);
        if (heading) {
          flush();
          const tag = heading[1].length === 1 ? 'h1' : 'h2';
          out.push('<' + tag + '>' + inline(heading[2]) + '</' + tag + '>');
        } else {
          paragraph.push(line);
        }
      }
      flush();
      return out.join('\n');
    }
    fetch('human-ai-resilience.md')
      .then(response => { if (!response.ok) throw new Error('HTTP ' + response.status); return response.text(); })
      .then(markdown => { document.getElementById('article').innerHTML = renderMarkdown(markdown); })
      .catch(error => { document.getElementById('article').innerHTML = '<p class="error">文章载入失败：' + escapeHtml(error.message) + '</p>'; });
  </script>
</body>
